# Local vLLM shared configuration.
#
# This file is sourced by the installer and helper scripts. Values can still be
# overridden for one command by exporting the same variable before running a
# script, for example:
#
#   LOCALVLLM_DIR=~/my-vllm ./install-localvllm.sh
#   VLLM_TENSOR_PARALLEL_SIZE=2 ./install-localvllm.sh
#
# vLLM serves one model per process. `localvllm use MODEL` selects the model
# started by the service; switching models restarts vLLM.

# Default install directory used when LOCALVLLM_DIR is not set.
LOCALVLLM_VERSION="${LOCALVLLM_VERSION:-1.0.0}"
LOCALVLLM_DEFAULT_DIR="${LOCALVLLM_DEFAULT_DIR:-$HOME/ai-vllm}"
LOCALVLLM_DEFAULT_DIR_DISPLAY="${LOCALVLLM_DEFAULT_DIR_DISPLAY:-~/ai-vllm}"

# Two isolated backends share the manager but never share runtime state:
#   vllm  -> plain vLLM (text, embeddings, reranking)
#   omni  -> vLLM-Omni (text, image, audio, video, action generation)
# Each has its own venv, model directory, launcher, keys, port, and systemd
# service. Both may run at the same time if the GPUs have room.
LOCALVLLM_DEFAULT_BACKEND="${LOCALVLLM_DEFAULT_BACKEND:-vllm}"
LOCALVLLM_BACKENDS="${LOCALVLLM_BACKENDS:-vllm omni}"
LOCALVLLM_BACKEND_PROFILES_SUBDIR="${LOCALVLLM_BACKEND_PROFILES_SUBDIR:-backends.d}"
LOCALVLLM_BACKENDS_STATE_SUBDIR="${LOCALVLLM_BACKENDS_STATE_SUBDIR:-backends}"

# Source used by `localvllm update` when refreshing installed helper scripts.
LOCALVLLM_REPO_URL="${LOCALVLLM_REPO_URL:-https://github.com/hossbit/local-ai-server-vllm.git}"
LOCALVLLM_TARBALL_BASE="${LOCALVLLM_TARBALL_BASE:-https://github.com/hossbit/local-ai-server-vllm/archive}"
LOCALVLLM_REF="${LOCALVLLM_REF:-main}"
# When set to a local checkout path, `localvllm update` uses it instead of
# fetching LOCALVLLM_REPO_URL from GitHub. Useful while developing this project.
LOCALVLLM_LOCAL_SOURCE_DIR="${LOCALVLLM_LOCAL_SOURCE_DIR:-}"

# Installed directory names and state files.
LOCALVLLM_USER_BIN_DIR="${LOCALVLLM_USER_BIN_DIR:-$HOME/.local/bin}"
LOCALVLLM_CLI_NAME="${LOCALVLLM_CLI_NAME:-localvllm}"
LOCALVLLM_BIN_SUBDIR="${LOCALVLLM_BIN_SUBDIR:-bin}"
LOCALVLLM_LIB_SUBDIR="${LOCALVLLM_LIB_SUBDIR:-lib}"
LOCALVLLM_CONF_SUBDIR="${LOCALVLLM_CONF_SUBDIR:-conf}"
LOCALVLLM_MODELS_SUBDIR="${LOCALVLLM_MODELS_SUBDIR:-models}"
LOCALVLLM_LOGS_SUBDIR="${LOCALVLLM_LOGS_SUBDIR:-logs}"
LOCALVLLM_VENV_SUBDIR="${LOCALVLLM_VENV_SUBDIR:-venv}"
LOCALVLLM_HF_CACHE_SUBDIR="${LOCALVLLM_HF_CACHE_SUBDIR:-hf-cache}"
LOCALVLLM_PORT_FILE="${LOCALVLLM_PORT_FILE:-port}"
LOCALVLLM_PID_FILE="${LOCALVLLM_PID_FILE:-vllm.pid}"
LOCALVLLM_ACTIVE_MODEL_FILE="${LOCALVLLM_ACTIVE_MODEL_FILE:-active-model}"
LOCALVLLM_SERVE_SCRIPT="${LOCALVLLM_SERVE_SCRIPT:-serve.sh}"
LOCALVLLM_SERVE_ENV_FILE="${LOCALVLLM_SERVE_ENV_FILE:-serve.env}"
LOCALVLLM_MODELS_OVERRIDE_SUBDIR="${LOCALVLLM_MODELS_OVERRIDE_SUBDIR:-models.d}"

# Local HTTP endpoint defaults. These are per backend; the generic
# LOCALVLLM_DEFAULT_PORT is only a fallback. The active port is stored in
# conf/backends/<backend>/port after the first start; edit that file or remove
# it to pick up a changed default.
LOCALVLLM_LISTEN_HOST="${LOCALVLLM_LISTEN_HOST:-127.0.0.1}"
LOCALVLLM_DEFAULT_PORT="${LOCALVLLM_DEFAULT_PORT:-8000}"
LOCALVLLM_VLLM_PORT="${LOCALVLLM_VLLM_PORT:-8000}"
LOCALVLLM_OMNI_PORT="${LOCALVLLM_OMNI_PORT:-8091}"

# systemd user services, one per backend.
LOCALVLLM_SERVICE_NAME="${LOCALVLLM_SERVICE_NAME:-localvllm.service}"
LOCALVLLM_VLLM_SERVICE_NAME="${LOCALVLLM_VLLM_SERVICE_NAME:-localvllm.service}"
LOCALVLLM_OMNI_SERVICE_NAME="${LOCALVLLM_OMNI_SERVICE_NAME:-localvllm-omni.service}"
LOCALVLLM_SYSTEMD_USER_DIR="${LOCALVLLM_SYSTEMD_USER_DIR:-$HOME/.config/systemd/user}"

# Python / vLLM installation. New environments automatically prefer a compatible
# Python 3.12, or download an isolated copy if needed. Set LOCALVLLM_PYTHON
# explicitly to use a different compatible interpreter.
LOCALVLLM_PYTHON="${LOCALVLLM_PYTHON:-python3}"
LOCALVLLM_MIN_PYTHON="${LOCALVLLM_MIN_PYTHON:-3.10}"
VLLM_VERSION="${VLLM_VERSION:-latest}"
# Optional pip arguments, e.g. an extra index URL for a ROCm or CPU wheel.
# This is a plain string; it is split on whitespace.
VLLM_PIP_ARGS="${VLLM_PIP_ARGS:-}"
# Optional vLLM-Omni support: text, image, audio, video, and action generation
# through the same `vllm serve ... --omni` entrypoint.
#   VLLM_OMNI=1                       enable --omni in the generated launcher
#   VLLM_OMNI_VERSION=latest          pin to the vLLM-Omni release line
#   VLLM_OMNI_EXTRAS=demo             install vllm-omni[demo]
# vLLM-Omni releases are aligned with a vLLM minor version; keep VLLM_VERSION
# and VLLM_OMNI_VERSION on the same line (for example 0.32.0).
VLLM_OMNI="${VLLM_OMNI:-0}"
VLLM_OMNI_VERSION="${VLLM_OMNI_VERSION:-latest}"
VLLM_OMNI_EXTRAS="${VLLM_OMNI_EXTRAS:-}"
VLLM_OMNI_PIP_ARGS="${VLLM_OMNI_PIP_ARGS:-}"
# Force a vLLM build target only when you know you need one. Empty means the
# platform default (CUDA wheels for the standard Linux wheel).
VLLM_TARGET_DEVICE="${VLLM_TARGET_DEVICE:-}"
# Set to 1 to permit installation on a machine where no supported GPU is
# detected. CPU vLLM is possible but usually requires a source build and is
# much slower than GPU serving.
VLLM_ALLOW_CPU="${VLLM_ALLOW_CPU:-0}"

# Package names used by install-localvllm.sh.
LOCALVLLM_APT_PACKAGES="${LOCALVLLM_APT_PACKAGES:-ca-certificates curl jq tar git python3 python3-venv python3-pip build-essential}"
LOCALVLLM_DNF_PACKAGES="${LOCALVLLM_DNF_PACKAGES:-ca-certificates curl jq tar git python3 python3-pip gcc gcc-c++ make}"
LOCALVLLM_YUM_PACKAGES="${LOCALVLLM_YUM_PACKAGES:-ca-certificates curl jq tar git python3 python3-pip gcc gcc-c++ make}"

# Service behavior.
LOCALVLLM_HEALTH_CHECK_TIMEOUT="${LOCALVLLM_HEALTH_CHECK_TIMEOUT:-900}"
LOCALVLLM_STOP_TIMEOUT="${LOCALVLLM_STOP_TIMEOUT:-30}"
LOCALVLLM_LOG_KEEP="${LOCALVLLM_LOG_KEEP:-5}"
# A non-loopback listener requires an active API key and this explicit
# acknowledgement. vLLM's key does not protect /health, /docs, or /sleep, so put
# TLS and proper authentication in a reverse proxy before exposing it.
LOCALVLLM_ALLOW_INSECURE_PUBLIC="${LOCALVLLM_ALLOW_INSECURE_PUBLIC:-0}"

# --- vLLM runtime defaults ------------------------------------------------
# Every value below can be overridden globally here, for one command via an
# exported variable, or per model in
# conf/backends/<backend>/models.d/<model-id>.conf using the shorter name
# without the VLLM_ prefix (TENSOR_PARALLEL_SIZE=2, ...).

# Number of GPUs used for tensor parallelism.
VLLM_TENSOR_PARALLEL_SIZE="${VLLM_TENSOR_PARALLEL_SIZE:-1}"
# Fraction of each GPU vLLM may reserve for weights + KV cache.
VLLM_GPU_MEMORY_UTILIZATION="${VLLM_GPU_MEMORY_UTILIZATION:-0.90}"
# Context window. Empty leaves vLLM's model-derived default, which can be huge
# and fail to fit; 8192 is a conservative, broadly useful default.
VLLM_MAX_MODEL_LEN="${VLLM_MAX_MODEL_LEN:-8192}"
VLLM_DTYPE="${VLLM_DTYPE:-auto}"
VLLM_QUANTIZATION="${VLLM_QUANTIZATION:-}"
VLLM_MAX_NUM_SEQS="${VLLM_MAX_NUM_SEQS:-256}"
# Optional cap on tokens processed in one scheduler batch. Useful for
# embedding/reranking workloads; empty leaves vLLM's default.
VLLM_MAX_NUM_BATCHED_TOKENS="${VLLM_MAX_NUM_BATCHED_TOKENS:-}"
VLLM_KV_CACHE_DTYPE="${VLLM_KV_CACHE_DTYPE:-auto}"
VLLM_SWAP_SPACE="${VLLM_SWAP_SPACE:-4}"
VLLM_CPU_OFFLOAD_GB="${VLLM_CPU_OFFLOAD_GB:-0}"
VLLM_ENFORCE_EAGER="${VLLM_ENFORCE_EAGER:-0}"
VLLM_TRUST_REMOTE_CODE="${VLLM_TRUST_REMOTE_CODE:-0}"
# Request logs can contain prompt text. Keep them off by default; set to 0 only
# for deliberate debugging.
VLLM_DISABLE_LOG_REQUESTS="${VLLM_DISABLE_LOG_REQUESTS:-1}"
VLLM_ENABLE_SLEEP="${VLLM_ENABLE_SLEEP:-0}"
# Optional vLLM flags. Leave empty unless the model needs them.
VLLM_SERVED_MODEL_NAME="${VLLM_SERVED_MODEL_NAME:-}"
VLLM_REVISION="${VLLM_REVISION:-}"
VLLM_CODE_REVISION="${VLLM_CODE_REVISION:-}"
VLLM_TOKENIZER_REVISION="${VLLM_TOKENIZER_REVISION:-}"
VLLM_TOKENIZER="${VLLM_TOKENIZER:-}"
VLLM_LOAD_FORMAT="${VLLM_LOAD_FORMAT:-}"
VLLM_CHAT_TEMPLATE="${VLLM_CHAT_TEMPLATE:-}"
VLLM_REASONING_PARSER="${VLLM_REASONING_PARSER:-}"
VLLM_TOOL_CALL_PARSER="${VLLM_TOOL_CALL_PARSER:-}"
# Extra vLLM arguments. Prefer an array in a models.d file when a value
# contains spaces:
#   EXTRA_ARGS=(--rope-scaling '{"type":"yarn","factor":2.0}')
# A plain string here is split on whitespace.
VLLM_EXTRA_ARGS="${VLLM_EXTRA_ARGS:-}"
# Extra environment variables exported before vLLM starts. Use an array in a
# models.d file: EXTRA_ENV=(VLLM_ATTENTION_BACKEND=FLASH_ATTN)
VLLM_EXTRA_ENV="${VLLM_EXTRA_ENV:-}"

# Hugging Face cache and token. When LOCALVLLM_HF_HOME is empty the installer
# and generated launcher use $AI_DIR/hf-cache. A token is only needed for
# gated/private repositories.
LOCALVLLM_HF_HOME="${LOCALVLLM_HF_HOME:-}"
LOCALVLLM_HF_TOKEN="${LOCALVLLM_HF_TOKEN:-}"
LOCALVLLM_CUDA_VISIBLE_DEVICES="${LOCALVLLM_CUDA_VISIBLE_DEVICES:-}"

# Optional fallback model used when no model has been selected with
# `localvllm use`. This can be a Hugging Face repo id or an absolute path.
LOCALVLLM_MODEL="${LOCALVLLM_MODEL:-}"

# `localvllm suggest` can use these in tests or on unusual hardware.
LOCALVLLM_SUGGEST_RAM_BYTES="${LOCALVLLM_SUGGEST_RAM_BYTES:-}"
LOCALVLLM_SUGGEST_VRAM_BYTES="${LOCALVLLM_SUGGEST_VRAM_BYTES:-}"
LOCALVLLM_SUGGEST_GPU_COUNT="${LOCALVLLM_SUGGEST_GPU_COUNT:-}"

# API key registry, stored under conf/ with mode 0600. vLLM itself supports one
# active API key per server; `localvllm key rotate` replaces it safely.
LOCALVLLM_API_KEY_FILE="${LOCALVLLM_API_KEY_FILE:-api-keys.tsv}"
# When 1, configuration generation refuses to produce an unauthenticated
# launcher. Leave at 0 for the same opt-in behavior as Local AI Server.
LOCALVLLM_REQUIRE_API_KEY="${LOCALVLLM_REQUIRE_API_KEY:-0}"
