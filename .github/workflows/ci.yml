name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Bash syntax
        run: |
          find . -type f \( -name '*.sh' -o -name 'localvllm' \) -print0 |
            xargs -0 -n1 bash -n

      - name: Run ShellCheck
        run: |
          shellcheck -x \
            localvllm install.sh install-localvllm.sh start.sh stop.sh \
            rebuild-config.sh update-localvllm.sh uninstall-localvllm.sh \
            lib/*.sh lib/cli/*.sh

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats jq python3-venv

      - name: Run Bats tests
        run: bats tests
